spring:
  application:
    name: dreamauto
  datasource:
    url: jdbc:postgresql://localhost:5432/automarket
    username: dreamauto
    password: secret
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false

security:
  jwt:
    secret: ${JWT_SECRET:dreamauto-demo-secret-please-change}
    expiration-minutes: 120

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
